{% extends 'base.html' %}

{% block title %}{% if object %}Редактировать{% else %}Создать{% endif %} запись{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Создать{% endif %} запись</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
</form>
{% endblock %}
