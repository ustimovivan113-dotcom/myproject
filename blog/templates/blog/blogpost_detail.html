{% extends 'base.html' %}

{% block title %}{{ blogpost.title }}{% endblock %}

{% block content %}
<h1>{{ blogpost.title }}</h1>
{% if blogpost.preview %}
    <img src="{{ blogpost.preview.url }}" alt="{{ blogpost.title }}" style="max-width: 100%;">
{% endif %}
<p>{{ blogpost.content }}</p>
<p>Дата создания: {{ blogpost.created_at|date:"d M Y" }}</p>
<p>Просмотры: {{ blogpost.views_count }}</p>
<a href="{% url 'blogpost_list' %}" class="btn btn-primary">Назад</a>
{% endblock %}
